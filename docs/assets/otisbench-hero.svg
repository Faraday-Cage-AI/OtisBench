<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img" aria-labelledby="title description">
  <title id="title">OtisBench: Engineering to shipment. Every decision carries.</title>
  <desc id="description">Manufacturing evaluation across ten tracks and 32 routes. Campaigns support up to 96 customer orders and 23,040 agent decisions.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#253348" stroke-width="1" opacity=".38"/></pattern>
  </defs>
  <rect width="1440" height="680" rx="24" fill="#0c1422"/>
  <rect width="1440" height="680" rx="24" fill="url(#grid)"/>
  <path d="M64 45H1376" stroke="#ffad55" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="94" fill="#ffad55" font-size="20" font-weight="700" letter-spacing="3">OTISBENCH</text>
    <text x="1376" y="94" text-anchor="end" fill="#a8b8ce" font-size="16" letter-spacing="2">MANUFACTURING AGENT EVALUATION</text>
    <text x="64" y="205" fill="#f3f6fb" font-size="78" font-weight="700" letter-spacing="-2">Engineering to shipment.</text>
    <text x="64" y="294" fill="#ffad55" font-size="78" font-weight="700" letter-spacing="-2">Every decision carries.</text>
    <text x="68" y="347" fill="#b4c3d6" font-size="25">A manufacturing gauntlet for frontier AI agents.</text>
    <path d="M64 395H1376" stroke="#33445b"/>
    <path d="M480 421V539M935 421V539" stroke="#33445b"/>
    <text x="68" y="474" fill="#f3f6fb" font-size="53" font-weight="700">10 tracks</text>
    <text x="70" y="514" fill="#a8b8ce" font-size="20">Engineering, execution, factory economics</text>
    <text x="514" y="474" fill="#f3f6fb" font-size="53" font-weight="700">96 orders</text>
    <text x="516" y="514" fill="#a8b8ce" font-size="20">Up to 96 customer orders per campaign</text>
    <text x="971" y="474" fill="#f3f6fb" font-size="53" font-weight="700">23,040</text>
    <text x="973" y="514" fill="#a8b8ce" font-size="20">Maximum campaign decision budget</text>
    <rect x="64" y="577" width="1312" height="58" rx="10" fill="#182638" stroke="#33445b"/>
    <text x="90" y="613" fill="#e3ebf5" font-size="18" letter-spacing="1">DRAWINGS</text>
    <text x="248" y="613" fill="#ffad55" font-size="22">→</text>
    <text x="292" y="613" fill="#e3ebf5" font-size="18" letter-spacing="1">MATERIAL</text>
    <text x="447" y="613" fill="#ffad55" font-size="22">→</text>
    <text x="492" y="613" fill="#e3ebf5" font-size="18" letter-spacing="1">PRODUCTION</text>
    <text x="685" y="613" fill="#ffad55" font-size="22">→</text>
    <text x="734" y="613" fill="#e3ebf5" font-size="18" letter-spacing="1">QUALITY</text>
    <text x="884" y="613" fill="#ffad55" font-size="22">→</text>
    <text x="933" y="613" fill="#e3ebf5" font-size="18" letter-spacing="1">SHIPMENT</text>
    <text x="1109" y="613" fill="#ffad55" font-size="22">→</text>
    <text x="1160" y="613" fill="#e3ebf5" font-size="18" letter-spacing="1">CASH</text>
  </g>
</svg>
